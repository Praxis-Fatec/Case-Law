# What SonarQube reads. Static analysis only: it never runs the system, never
# connects to PostgreSQL and never needs the published decisions. The coverage
# figures are the one exception — they come from reports the test suites write,
# and the backend suite needs an empty `caselaw_test` to produce a full one.

sonar.projectKey=case-law
sonar.projectName=Case Law
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src,pipeline
sonar.tests=backend/tests,frontend/src/tests,pipeline/tests

# Test files live inside `frontend/src`, which is also a source root. Without
# this they would be analysed twice and counted as production code.
sonar.test.inclusions=backend/tests/**,frontend/src/tests/**,pipeline/tests/**

sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/__pycache__/**,\
  frontend/src/tests/**,\
  pipeline/transformations/**,\
  **/fixtures/**

# `sonar.exclusions` does not reach files declared as tests, and the saved
# BDJur pages are captured evidence, not markup anyone writes.
sonar.test.exclusions=**/fixtures/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml,pipeline/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
