[project]
name = "case-law-pipeline"
version = "0.1.0"
description = "Extraction and transformation of judicial decision data"
requires-python = ">=3.12"
dependencies = [
    "dlt[postgres]>=1.30.0",
    "psycopg2-binary>=2.9.13",
    "sqlmesh>=0.236.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Lets pytest import `sources` without installing the project.
pythonpath = ["."]

[dependency-groups]
embeddings = [
    "sentence-transformers>=5.0.0",
    "torch>=2.9.0",
]
dev = [
    # Only the tests use it. The pipeline itself talks to PostgreSQL through
    # dlt and SQLMesh, which bring psycopg2; the tests build models and compare
    # the rows, and psycopg3's connection reads better for that.
    "psycopg[binary]>=3.2.0",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
